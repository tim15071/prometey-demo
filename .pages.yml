media:
  - name: documents
    label: Файлы документов
    input: uploads/documents
    output: /prometey-demo/uploads/documents
    extensions: [pdf, doc, docx, xls, xlsx, odt, ods, txt, csv]
    rename: safe
  - name: images
    label: Фотографии
    input: uploads/images
    output: /prometey-demo/uploads/images
    extensions: [jpg, jpeg, png, webp]
    rename: safe

